<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HCA Made Clear — Ask anything about our facilities</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <span class="hca-logo">HCA Healthcare UK</span>
      <span class="divider"></span>
      <span class="built-with">built with <strong>MadeClear</strong></span>
    </div>
    <div class="topbar-right">AI training tool — demo build</div>
  </header>

  <section class="hero">
    <p class="eyebrow">HCA MADE CLEAR</p>
    <h1>Ask anything about our facilities</h1>
    <p class="subhead">Every scene of every film, tagged and searchable. Ask a question the way a patient would.</p>

    <form class="search-form" id="search-form">
      <input type="text" id="search-input" placeholder="e.g. Does the Wellington have an MRI scanner?" autocomplete="off">
      <button type="submit" aria-label="Search">→</button>
    </form>

    <div class="pills" id="pills">
      <button class="pill" type="button">Does the Wellington have an MRI machine?</button>
      <button class="pill" type="button">What does the hydrotherapy pool look like?</button>
      <button class="pill" type="button">How are patient meals served?</button>
      <button class="pill" type="button">Show me the operating theatres</button>
      <button class="pill" type="button">Does the Princess Grace have an MRI machine?</button>
    </div>
  </section>

  <main class="library">
    <div class="library-header">
      <h2>Film library</h2>
      <span id="film-count" class="film-count"></span>
    </div>
    <div class="film-grid" id="film-grid"></div>
  </main>

  <section id="results" class="results" hidden>
    <h2>Results</h2>
    <div id="results-grid" class="results-grid"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
