# Builds the clip renderer container and deploys it to Cloudflare whenever
# the renderer, its data or this workflow changes on main. Can also be run by
# hand from the Actions tab. GitHub's runners have Docker, which Wrangler
# needs to build the image.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN    Workers + Containers edit, hello@ account
#   CLOUDFLARE_ACCOUNT_ID   the hello@ account ID
#   SUPABASE_SECRET_KEY     sb_secret_... for project rlpidxfxazhqhvryiolh
#   R2_ACCESS_KEY_ID        R2 token for the hca-masters bucket
#   R2_SECRET_ACCESS_KEY
#   TRIGGER_SECRET          shared with Supabase so only it can start renders
name: Deploy clip renderer

on:
  push:
    branches: [main]
    paths:
      - "cloud/**"
      - "pipeline/clip_render.py"
      - "pipeline/clip_worker.py"
      - "site/clipdata/**"
      - "brand/**"
      - "site/index.json"
      - "site/assets/compliance.json"
      - ".github/workflows/deploy-renderer.yml"
  workflow_dispatch:

concurrency: deploy-renderer

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Deploy the Worker and container
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set the Worker's secrets
        run: |
          node -e 'const e=process.env, t=k=>String(e[k]||"").trim(); require("fs").writeFileSync("secrets.json", JSON.stringify({
            SUPABASE_SECRET_KEY: t("SUPABASE_SECRET_KEY"), R2_ACCOUNT_ID: t("CLOUDFLARE_ACCOUNT_ID"),
            R2_ACCESS_KEY_ID: t("R2_ACCESS_KEY_ID"), R2_SECRET_ACCESS_KEY: t("R2_SECRET_ACCESS_KEY"),
            TRIGGER_SECRET: t("TRIGGER_SECRET") }))'
          npx wrangler secret bulk secrets.json
          rm -f secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TRIGGER_SECRET: ${{ secrets.TRIGGER_SECRET }}
      - name: Restart the renderer so it picks up the new settings
        run: |
          curl -fsS -X POST -H "x-trigger-secret: $(printf %s "$TRIGGER_SECRET" | tr -d '[:space:]')" \
            https://hca-clip-renderer.dry-mountain-5452.workers.dev/restart || echo "restart skipped"
        env:
          TRIGGER_SECRET: ${{ secrets.TRIGGER_SECRET }}
